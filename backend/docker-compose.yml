version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: always
    environment:
      POSTGRES_DB: rag_knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rag_knowledge" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # RAG 知识库应用
  rag-knowledge-base:
    build:
      dockerfile: Dockerfile
    container_name: rag-knowledge-base
    restart: always
    ports:
      - "8080:8080"
    environment:
      # PostgreSQL 配置
      POSTGRES_URL: jdbc:postgresql://postgres:5432/rag_knowledge
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres

      # MinIO 配置
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: rag-documents

      # 管理后台配置
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # JVM 参数
      JAVA_OPTS: -Xms512m -Xmx512m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs

volumes:
  postgres-data:
  app-logs:

networks:
  default:
    name: rag-knowledge-base-network
