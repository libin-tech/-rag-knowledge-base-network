server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: rag-knowledge-base
  config:
    import: "optional:file:backend/.env[.properties]"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/rag_knowledge}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5


mybatis-plus:
  type-aliases-package: com.bintech.rag.repository
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pgvector:
  table-name: vector_embeddings
  dimension: 1024
  create-table: true
  use-index: true
  index-list-size: 100

rag:
  chunk:
    max-segment-size: 500
    max-overlap-size: 50
  retrieval:
    max-results: 5
    min-score: 0.7

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-head: true


logging:
  level:
    com.bintech.rag: INFO
    dev.langchain4j: DEBUG
    com.bintech.rag.lark: DEBUG

auth:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin@2026}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:rag-documents}
