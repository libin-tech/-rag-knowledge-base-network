<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息渠道管理 - RAG知识库</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --sidebar-width: 250px;
        }

        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .sidebar-brand h4 {
            color: white;
            margin: 0;
            font-size: 1.3rem;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        /* 知识库选择器样式 */
        .kb-select-wrapper {
            position: relative;
            width: 100%;
        }

        .kb-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }

        .kb-select-trigger:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .kb-select-trigger:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .kb-select-arrow {
            font-size: 12px;
            transition: transform 0.3s;
            color: rgba(255, 255, 255, 0.8);
        }

        .kb-select-arrow.open {
            transform: rotate(180deg);
        }

        .kb-select-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 9999;
            max-height: 240px;
            overflow-y: auto;
        }

        .kb-select-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .kb-select-option {
            padding: 10px 12px;
            color: #2d3748;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }

        .kb-select-option:hover {
            background: #f1f3f4;
        }

        .kb-select-option.selected {
            background: #e8f0fe;
            color: #1a73e8;
        }

        .kb-select-option i {
            margin-right: 8px;
            font-size: 14px;
            color: #667eea;
        }

        .kb-select-option.selected i {
            color: #1a73e8;
        }

        .kb-select-empty {
            padding: 12px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        
        .user-center {
            position: fixed;
            bottom: 24px;
            left: calc(var(--sidebar-width) + 24px);
            z-index: 9999;
        }

        .user-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .user-trigger:hover {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin: 0;
        }

        .user-dropdown {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            width: 260px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.25s ease;
            border: none;
            overflow: hidden;
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-header {
            padding: 16px;
            border-bottom: 1px solid #e8eaed;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .dropdown-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .dropdown-user-details {
            flex: 1;
        }

        .dropdown-user-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .dropdown-login-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin: 2px 0 0;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #5f6368;
            text-decoration: none;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: #f1f3f4;
        }

        .dropdown-item i {
            width: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .dropdown-divider {
            height: 1px;
            background: #e8eaed;
            margin: 0;
        }

        .dropdown-item.logout {
            color: #d93025;
        }

        .dropdown-item.logout i {
            color: #d93025;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
        }

        .channel-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .channel-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-title h4 {
            margin: 0;
            color: #2d3748;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-enabled { background: #d1fae5; color: #065f46; }
        .status-disabled { background: #fee2e2; color: #991b1b; }

        .config-section {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #718096;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #4f46e5;
        }

        .config-row {
            display: none;
        }

        .config-row.active {
            display: block;
        }

        .channel-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h4><i class="bi bi-journal-text"></i> RAG知识库</h4>
            <small>管理后台</small>
        </div>
        <div class="px-3 mb-3">
            <label class="text-white small opacity-75">当前知识库</label>
            <div class="kb-select-wrapper">
                <div class="kb-select-trigger" id="kbSelectTrigger" onclick="toggleKbDropdown()">
                    <span id="kbSelectedName">选择知识库</span>
                    <i class="bi bi-chevron-down kb-select-arrow" id="kbSelectArrow"></i>
                </div>
                <div class="kb-select-dropdown" id="kbSelectDropdown">
                    <div class="kb-select-empty" id="kbLoading">加载中...</div>
                </div>
            </div>
            <input type="hidden" id="knowledgeBaseId" name="knowledgeBaseId" value="">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/admin/upload">
                <i class="bi bi-cloud-upload-fill"></i> 文档上传
            </a>
            <a class="nav-link" href="/admin/documents">
                <i class="bi bi-file-earmark-text-fill"></i> 文档管理
            </a>
            <a class="nav-link" href="/admin/chat">
                <i class="bi bi-chat-dots-fill"></i> 问答测试
            </a>
            <a class="nav-link active" href="/admin/channel">
                <i class="bi bi-chat-dots-fill"></i> 消息渠道
            </a>
        </nav>
    </div>

    <!-- 左下角用户中心 -->
    <div class="user-center">
        <div class="user-trigger" onclick="toggleUserDropdown()">
            <div class="user-avatar">
                <i class="bi bi-person"></i>
            </div>
            <div class="user-info">
                <p class="user-name">管理员</p>
            </div>
            <i class="bi bi-chevron-up" style="font-size: 12px; color: #667eea;"></i>
        </div>
        <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-header">
                <div class="dropdown-user-info">
                    <div class="dropdown-avatar">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="dropdown-user-details">
                        <p class="dropdown-user-name">管理员</p>
                        <p class="dropdown-login-time" id="loginTime">登录时间</p>
                    </div>
                </div>
            </div>
            <a href="/admin/knowledge-base" class="dropdown-item">
                <i class="bi bi-folder-fill"></i> 知识库管理
            </a>
            <a href="/admin/config" class="dropdown-item">
                <i class="bi bi-gear-fill"></i> 模型配置
            </a>
            <div class="dropdown-divider"></div>
            <a href="/logout" class="dropdown-item logout">
                <i class="bi bi-box-arrow-right"></i> 退出登录
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div id="channelList"></div>
    </div>

    <div class="text-center text-muted" style="font-size: 0.8rem; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);">
        © 2026 xxx公司. All Rights Reserved.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    let currentKnowledgeBaseId = localStorage.getItem('currentKnowledgeBaseId') || 'default';

    function loadKnowledgeBases() {
        fetch('/admin/api/knowledge-base/list')
            .then(res => res.json())
            .then(data => {
                const dropdown = document.getElementById('kbSelectDropdown');
                const loading = document.getElementById('kbLoading');
                
                if (loading) {
                    loading.remove();
                }
                
                dropdown.innerHTML = '';
                
                if (data.length === 0) {
                    dropdown.innerHTML = '<div class="kb-select-empty">暂无知识库</div>';
                    return;
                }
                
                data.forEach(kb => {
                    const option = document.createElement('div');
                    option.className = 'kb-select-option';
                    option.dataset.id = kb.id;
                    option.innerHTML = `<i class="bi bi-folder-fill"></i> ${kb.name}`;
                    
                    if (kb.id === currentKnowledgeBaseId) {
                        option.classList.add('selected');
                        document.getElementById('kbSelectedName').textContent = kb.name;
                        document.getElementById('knowledgeBaseId').value = kb.id;
                    }
                    
                    option.addEventListener('click', function() {
                        selectKnowledgeBase(kb.id, kb.name);
                    });
                    
                    dropdown.appendChild(option);
                });
                loadChannels();
            })
            .catch(err => {
                console.error('加载知识库失败:', err);
                document.getElementById('kbSelectDropdown').innerHTML = '<div class="kb-select-empty">加载失败</div>';
            });
    }

    function selectKnowledgeBase(id, name) {
        currentKnowledgeBaseId = id;
        localStorage.setItem('currentKnowledgeBaseId', id);
        document.getElementById('kbSelectedName').textContent = name;
        document.getElementById('knowledgeBaseId').value = id;
        
        document.querySelectorAll('.kb-select-option').forEach(opt => {
            opt.classList.remove('selected');
        });
        document.querySelector(`[data-id="${id}"]`).classList.add('selected');
        
        loadChannels();
        closeKbDropdown();
    }

    function toggleKbDropdown() {
        const dropdown = document.getElementById('kbSelectDropdown');
        const arrow = document.getElementById('kbSelectArrow');
        
        if (dropdown.classList.contains('show')) {
            closeKbDropdown();
        } else {
            closeUserDropdown();
            dropdown.classList.add('show');
            arrow.classList.add('open');
        }
    }

    function closeUserDropdown() {
        const dropdown = document.getElementById('userDropdown');
        if (dropdown) {
            dropdown.classList.remove('show');
        }
    }

    function closeKbDropdown() {
        const dropdown = document.getElementById('kbSelectDropdown');
        const arrow = document.getElementById('kbSelectArrow');
        dropdown.classList.remove('show');
        arrow.classList.remove('open');
    }

    const channelConfigs = {
        'FEISHU': {
            channelName: '飞书',
            icon: '../images/feishu_logo.png',
            iconClass: 'channel-icon',
            useImg: true,
            fields: [
                { name: 'appId', label: 'App ID', placeholder: '请输入飞书 App ID' },
                { name: 'appSecret', label: 'App Secret', placeholder: '请输入飞书 App Secret', type: 'password' }
            ]
        },
        'DINGTALK': {
            channelName: '钉钉',
            icon: '../images/dingtalk_logo.png',
            iconClass: 'channel-icon',
            useImg: true,
            fields: [
                { name: 'clientId', label: 'Client ID', placeholder: '请输入钉钉 Client ID' },
                { name: 'clientSecret', label: 'Client Secret', placeholder: '请输入钉钉 Client Secret', type: 'password' }
            ]
        },
        'WECHAT_WORK': {
            channelName: '企业微信',
            icon: '../images/wechat_work_logo.png',
            iconClass: 'channel-icon',
            useImg: true,
            fields: [
                { name: 'corpId', label: '企业ID', placeholder: '请输入企业微信企业ID' },
                { name: 'agentId', label: '应用ID', placeholder: '请输入企业微信应用ID' },
                { name: 'corpSecret', label: '应用密钥', placeholder: '请输入企业微信应用密钥', type: 'password' }
            ]
        }
    };

    function togglePassword(btn) {
        const input = btn.parentElement.querySelector('input');
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<i class="bi bi-eye"></i>';
        }
    }

    function loadChannels() {
        fetch('/admin/api/channel/list?knowledgeBaseId=' + currentKnowledgeBaseId)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    renderChannels(data.data || []);
                }
            });
    }

    function renderChannels(channels) {
        const container = document.getElementById('channelList');
        const defaultChannelTypes = ['FEISHU', 'DINGTALK', 'WECHAT_WORK'];

        container.innerHTML = defaultChannelTypes.map(type => {
            const config = channelConfigs[type] || {};
            const channel = channels.find(c => c.channelType === type) || {
                channelType: type,
                channelName: config.channelName || type,
                enabled: false,
                configJson: '{}'
            };

            const statusClass = channel.enabled ? 'status-enabled' : 'status-disabled';
            const statusText = channel.enabled ? '已启用' : '已停用';
            const configValue = channel.configJson ? JSON.parse(channel.configJson) : {};
            const iconClass = config.iconClass || 'channel-icon';
            const icon = config.icon || 'bi-chat-dots-fill';

            return `
                <div class="channel-card">
                    <div class="channel-header">
                        <div class="channel-title">
                            ${config.useImg ? `<img src="${icon}" class="${iconClass}" alt="${type}">` : `<i class="${icon} ${iconClass}"></i>`}
                            <h4>${channel.channelName}</h4>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div>
                            <button class="btn btn-sm ${channel.enabled ? 'btn-outline-danger' : 'btn-outline-primary'}"
                                    onclick="toggleChannel('${type}', ${!channel.enabled})">
                                ${channel.enabled ? '停用' : '启用'}
                            </button>
                            <button class="btn btn-sm btn-link" onclick="showConfig('${type}')">
                                配置
                            </button>
                        </div>
                    </div>
                    <div class="config-section" id="config-${type}" style="display: none;">
                        <form id="form-${type}">
                            ${config.fields ? config.fields.map(field => `
                                <div class="row mb-2">
                                    <div class="col-md-6">
                                        <label class="form-label">${field.label}</label>
                                        ${field.type === 'password' ? `
                                            <div class="password-wrapper">
                                                <input type="${field.type}" class="form-control"
                                                       name="${field.name}"
                                                       placeholder="${field.placeholder}"
                                                       value="${configValue[field.name] || ''}">
                                                <button type="button" class="password-toggle" onclick="togglePassword(this)">
                                                    <i class="bi bi-eye"></i>
                                                </button>
                                            </div>
                                        ` : `
                                            <input type="text" class="form-control"
                                                   name="${field.name}"
                                                   placeholder="${field.placeholder}"
                                                   value="${configValue[field.name] || ''}">
                                        `}
                                    </div>
                                </div>
                            `).join('') : ''}
                            <div class="mt-2">
                                <button type="button" class="btn btn-primary btn-sm" onclick="saveConfig('${type}')">
                                    保存
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleChannel(channelType, enabled) {
        fetch('/admin/api/channel/' + channelType, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ channelType, enabled, knowledgeBaseId: currentKnowledgeBaseId, modifier: 'admin' })
        }).then(r => r.json()).then(data => {
            if (data.success) {
                loadChannels();
            } else {
                alert('操作失败: ' + data.message);
            }
        });
    }

    function showConfig(channelType) {
        const el = document.getElementById('config-' + channelType);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function saveConfig(channelType) {
        const form = document.getElementById('form-' + channelType);
        const formData = new FormData(form);
        const configValueJSON = JSON.stringify(Object.fromEntries(formData.entries()));

        fetch('/admin/api/channel/' + channelType, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                configJson: configValueJSON,
                knowledgeBaseId: currentKnowledgeBaseId,
                modifier: 'admin'
            })
        }).then(r => r.json()).then(data => {
            if (data.success) {
                alert('保存成功');
                loadChannels();
            } else {
                alert('保存失败: ' + data.message);
            }
        });
    }

    loadKnowledgeBases();

    // 用户中心下拉菜单切换
    function toggleUserDropdown() {
        const dropdown = document.getElementById('userDropdown');
        dropdown.classList.toggle('show');
    }

    // 点击外部关闭下拉菜单
    document.addEventListener('click', function(e) {
        const userCenter = document.querySelector('.user-center');
        if (!userCenter.contains(e.target)) {
            document.getElementById('userDropdown').classList.remove('show');
        }
    });

    // 设置登录时间
    document.addEventListener('DOMContentLoaded', function() {
        const loginTime = new Date().toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
        document.getElementById('loginTime').textContent = loginTime;
    });
    </script>
</body>
</html>
