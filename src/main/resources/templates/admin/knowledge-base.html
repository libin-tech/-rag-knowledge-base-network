<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - RAG知识库管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --sidebar-width: 250px;
        }
        
        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
            z-index: 1000;
        }
        
        .sidebar-brand {
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-brand h4 {
            color: white;
            margin: 0;
            font-size: 1.3rem;
        }
        
        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .nav-link i {
            margin-right: 10px;
            width: 20px;
        }

        .user-center {
            position: fixed;
            bottom: 24px;
            left: calc(var(--sidebar-width) + 24px);
            z-index: 9999;
        }

        .user-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .user-trigger:hover {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin: 0;
        }

        .user-dropdown {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            width: 260px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.25s ease;
            border: none;
            overflow: hidden;
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-header {
            padding: 16px;
            border-bottom: 1px solid #e8eaed;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .dropdown-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .dropdown-user-details {
            flex: 1;
        }

        .dropdown-user-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .dropdown-login-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin: 2px 0 0;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #5f6368;
            text-decoration: none;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: #f1f3f4;
        }

        .dropdown-item i {
            width: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .dropdown-divider {
            height: 1px;
            background: #e8eaed;
            margin: 0;
        }

        .dropdown-item.logout {
            color: #d93025;
        }

        .dropdown-item.logout i {
            color: #d93025;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
        }
        
        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-header h2 {
            margin: 0;
            color: #1a202c;
            font-size: 1.5rem;
        }
        
        .page-header p {
            margin: 5px 0 0;
            color: #718096;
            font-size: 0.9rem;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .card-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0 !important;
        }
        
        .card-header h5 {
            margin: 0;
            color: #2d3748;
            font-size: 1.1rem;
        }
        
        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
        }
        
        .btn-primary:hover {
            background: #4338ca;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-enabled { background: #d1fae5; color: #065f46; }
        .status-disabled { background: #fee2e2; color: #991b1b; }

        .table th {
            border-top: none;
            color: #718096;
            font-weight: 500;
        }

        .modal-content {
            border-radius: 12px;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0 !important;
        }

        .modal-header h5 {
            margin: 0;
        }

        .form-label {
            font-weight: 500;
            color: #2d3748;
        }

        .form-control:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h4><i class="bi bi-journal-text"></i> RAG知识库</h4>
            <small>管理后台</small>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/admin/upload">
                <i class="bi bi-cloud-upload-fill"></i> 文档上传
            </a>
            <a class="nav-link" href="/admin/documents">
                <i class="bi bi-file-earmark-text-fill"></i> 文档管理
            </a>
            <a class="nav-link" href="/admin/chat">
                <i class="bi bi-chat-dots-fill"></i> 问答测试
            </a>
            <a class="nav-link" href="/admin/channel">
                <i class="bi bi-chat-dots-fill"></i> 消息渠道
            </a>
        </nav>
    </div>

    <!-- 左下角用户中心 -->
    <div class="user-center">
        <div class="user-trigger" onclick="toggleUserDropdown()">
            <div class="user-avatar">
                <i class="bi bi-person"></i>
            </div>
            <div class="user-info">
                <p class="user-name">管理员</p>
            </div>
            <i class="bi bi-chevron-up" style="font-size: 12px; color: #667eea;"></i>
        </div>
        <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-header">
                <div class="dropdown-user-info">
                    <div class="dropdown-avatar">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="dropdown-user-details">
                        <p class="dropdown-user-name">管理员</p>
                        <p class="dropdown-login-time" id="loginTime">登录时间</p>
                    </div>
                </div>
            </div>
            <a href="/admin/knowledge-base" class="dropdown-item" style="background: #f1f3f4;">
                <i class="bi bi-folder-fill"></i> 知识库管理
            </a>
            <a href="/admin/config" class="dropdown-item">
                <i class="bi bi-gear-fill"></i> 模型配置
            </a>
            <div class="dropdown-divider"></div>
            <a href="/logout" class="dropdown-item logout">
                <i class="bi bi-box-arrow-right"></i> 退出登录
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="page-header">
            <div>
                <h2><i class="bi bi-folder"></i> 知识库管理</h2>
                <p>管理系统中的知识库</p>
            </div>
            <button class="btn btn-primary" onclick="showCreateModal()">
                <i class="bi bi-plus"></i> 新建知识库
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-list"></i> 知识库列表</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>描述</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="knowledgeBaseTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建/编辑模态框 -->
    <div class="modal fade" id="knowledgeBaseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="modalTitle">新建知识库</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="knowledgeBaseForm">
                        <input type="hidden" id="idInput">
                        <div class="mb-3">
                            <label class="form-label">知识库名称</label>
                            <input type="text" class="form-control" id="nameInput" placeholder="请输入知识库名称" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="descriptionInput" placeholder="请输入知识库描述" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-check-label">
                                <input type="checkbox" class="form-check-input" id="enabledInput" checked>
                                启用
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveKnowledgeBase()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted mt-4" style="font-size: 0.8rem; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);">
        © 2026 xxx公司. All Rights Reserved.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentEditingId = null;

        function loadKnowledgeBases() {
            fetch('/admin/api/knowledge-base/all')
                .then(res => res.json())
                .then(data => {
                    renderKnowledgeBases(data);
                })
                .catch(err => {
                    console.error('加载知识库失败:', err);
                    document.getElementById('knowledgeBaseTableBody').innerHTML = 
                        '<tr><td colspan="5" class="text-center text-muted">加载失败</td></tr>';
                });
        }

        function renderKnowledgeBases(kbList) {
            if (!kbList || kbList.length === 0) {
                document.getElementById('knowledgeBaseTableBody').innerHTML = 
                    '<tr><td colspan="5" class="text-center text-muted">暂无知识库</td></tr>';
                return;
            }

            const tbody = document.getElementById('knowledgeBaseTableBody');
            tbody.innerHTML = kbList.map(kb => `
                <tr>
                    <td>
                        <strong>${kb.name}</strong>
                        ${kb.id === 'default' ? '<span class="badge bg-secondary ms-2">默认</span>' : ''}
                    </td>
                    <td>${kb.description || '-'}</td>
                    <td>
                        <span class="status-badge ${kb.enabled ? 'status-enabled' : 'status-disabled'}">
                            ${kb.enabled ? '已启用' : '已禁用'}
                        </span>
                    </td>
                    <td>${kb.createTime ? formatDateTime(kb.createTime) : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="showEditModal('${kb.id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        ${kb.id !== 'default' ? `
                            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteKnowledgeBase('${kb.id}', '${kb.name}')">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function showCreateModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = '新建知识库';
            document.getElementById('idInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('descriptionInput').value = '';
            document.getElementById('enabledInput').checked = true;
            
            const nameInput = document.getElementById('nameInput');
            nameInput.classList.remove('is-invalid');
            
            new bootstrap.Modal(document.getElementById('knowledgeBaseModal')).show();
        }

        function showEditModal(id) {
            fetch(`/admin/api/knowledge-base/${id}`)
                .then(res => res.json())
                .then(kb => {
                    currentEditingId = id;
                    document.getElementById('modalTitle').textContent = '编辑知识库';
                    document.getElementById('idInput').value = kb.id;
                    document.getElementById('nameInput').value = kb.name;
                    document.getElementById('descriptionInput').value = kb.description || '';
                    document.getElementById('enabledInput').checked = kb.enabled;
                    
                    new bootstrap.Modal(document.getElementById('knowledgeBaseModal')).show();
                })
                .catch(err => console.error('获取知识库失败:', err));
        }

        function saveKnowledgeBase() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            
            // 前端校验：名称不能为空
            if (!name) {
                nameInput.classList.add('is-invalid');
                return;
            }
            
            // 前端校验：名称不能重复
            const excludeId = currentEditingId || null;
            checkNameExists(name, excludeId).then(exists => {
                if (exists) {
                    nameInput.classList.add('is-invalid');
                    return;
                }
                
                nameInput.classList.remove('is-invalid');
                
                const data = {
                    id: document.getElementById('idInput').value || generateId(),
                    name: name,
                    description: document.getElementById('descriptionInput').value,
                    enabled: document.getElementById('enabledInput').checked,
                    creator: 'admin',
                    modifier: 'admin'
                };

                const method = currentEditingId ? 'PUT' : 'POST';
                const url = currentEditingId ? `/admin/api/knowledge-base/${currentEditingId}` : '/admin/api/knowledge-base';

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success === false) {
                        alert(result.message || '保存失败');
                        return;
                    }
                    bootstrap.Modal.getInstance(document.getElementById('knowledgeBaseModal')).hide();
                    loadKnowledgeBases();
                })
                .catch(err => console.error('保存知识库失败:', err));
            });
        }
        
        // 检查名称是否存在
        async function checkNameExists(name, excludeId) {
            try {
                const url = excludeId 
                    ? `/admin/api/knowledge-base/check-name?name=${encodeURIComponent(name)}&excludeId=${excludeId}`
                    : `/admin/api/knowledge-base/check-name?name=${encodeURIComponent(name)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.exists || false;
            } catch (err) {
                console.error('检查名称失败:', err);
                return false;
            }
        }

        function deleteKnowledgeBase(id, name) {
            // 先检查是否存在相关数据
            fetch(`/admin/api/knowledge-base/${id}/check-delete`)
                .then(res => res.json())
                .then(data => {
                    if (data.success === false) {
                        alert(data.message);
                        return;
                    }
                    
                    if (data.hasDocuments || data.hasVectorData) {
                        // 存在相关数据，需要确认是否级联删除
                        const confirmMessage = `知识库 "${name}" 下存在以下数据：\n` +
                            (data.hasDocuments ? '  - 文档\n' : '') +
                            (data.hasVectorData ? '  - 向量数据\n' : '') +
                            '确定要删除知识库及所有相关数据吗？此操作不可撤销。';
                        
                        if (!confirm(confirmMessage)) {
                            return;
                        }
                        
                        // 级联删除
                        fetch(`/admin/api/knowledge-base/${id}?deleteRelated=true`, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(result => {
                                if (result.success) {
                                    loadKnowledgeBases();
                                } else {
                                    alert('删除失败: ' + result.message);
                                }
                            })
                            .catch(err => {
                                console.error('删除知识库失败:', err);
                                alert('删除失败');
                            });
                    } else {
                        // 不存在相关数据，直接删除
                        if (!confirm(`确定要删除知识库 "${name}" 吗？此操作不可撤销。`)) {
                            return;
                        }
                        
                        fetch(`/admin/api/knowledge-base/${id}`, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(result => {
                                if (result.success) {
                                    loadKnowledgeBases();
                                } else {
                                    alert('删除失败: ' + result.message);
                                }
                            })
                            .catch(err => {
                                console.error('删除知识库失败:', err);
                                alert('删除失败');
                            });
                    }
                })
                .catch(err => {
                    console.error('检查知识库数据失败:', err);
                    alert('检查失败');
                });
        }

        function generateId() {
            return 'kb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        document.addEventListener('DOMContentLoaded', loadKnowledgeBases);

        // 用户中心下拉菜单切换
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(e) {
            const userCenter = document.querySelector('.user-center');
            if (!userCenter.contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        // 设置登录时间
        document.addEventListener('DOMContentLoaded', function() {
            const loginTime = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('loginTime').textContent = loginTime;
        });
    </script>
</body>
</html>
