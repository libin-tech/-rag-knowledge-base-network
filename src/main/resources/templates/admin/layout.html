<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'RAG知识库管理后台'">RAG知识库管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --sidebar-width: 250px;
        }

        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar-brand {
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .sidebar-brand h4 {
            color: white;
            margin: 0;
            font-size: 1.3rem;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        .nav-item {
            margin: 5px 15px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
        }

        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .page-header h2 {
            margin: 0;
            color: #1a202c;
            font-size: 1.5rem;
        }

        .page-header p {
            margin: 5px 0 0;
            color: #718096;
            font-size: 0.9rem;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .card-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0 !important;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3748;
            font-size: 1.1rem;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .alert {
            border-radius: 8px;
            border: none;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h4><i class="bi bi-journal-text"></i> RAG知识库</h4>
            <small>管理后台</small>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${currentPage} == 'upload' ? 'active' : ''"
               th:href="@{/admin/upload}">
                <i class="bi bi-cloud-upload-fill"></i> 文档上传
            </a>
            <a class="nav-link" th:classappend="${currentPage} == 'documents' ? 'active' : ''"
               th:href="@{/admin/documents}">
                <i class="bi bi-file-earmark-text-fill"></i> 文档管理
            </a>
            <a class="nav-link" th:classappend="${currentPage} == 'chat' ? 'active' : ''"
               th:href="@{/admin/chat}">
                <i class="bi bi-chat-dots-fill"></i> 问答测试
            </a>
            <a class="nav-link" th:classappend="${currentPage} == 'config' ? 'active' : ''"
               th:href="@{/admin/config}">
                <i class="bi bi-gear-fill"></i> 模型配置
            </a>
            <a class="nav-link" th:classappend="${currentPage} == 'channel' ? 'active' : ''"
               th:href="@{/admin/channel}">
                <i class="bi bi-chat-dots-fill"></i> 消息渠道
            </a>
        </nav>
    </div>

    <!-- 主内容区 -->
    <div class="main-content" layout:fragment="content">
        <div th:replace="${content}"></div>
        <div class="text-center text-muted mt-4" style="font-size: 0.8rem;">
            © 2026 xxx公司. All Rights Reserved.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
