<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档管理 - RAG知识库管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --sidebar-width: 250px;
        }
        
        body {
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
            z-index: 1000;
        }
        
        .sidebar-brand {
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-brand h4 {
            color: white;
            margin: 0;
            font-size: 1.3rem;
        }
        
        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }
        
        .nav-item {
            margin: 5px 15px;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        /* 知识库选择器样式 */
        .kb-select-wrapper {
            position: relative;
            width: 100%;
        }

        .kb-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }

        .kb-select-trigger:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .kb-select-trigger:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .kb-select-arrow {
            font-size: 12px;
            transition: transform 0.3s;
            color: rgba(255, 255, 255, 0.8);
        }

        .kb-select-arrow.open {
            transform: rotate(180deg);
        }

        .kb-select-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 9999;
            max-height: 240px;
            overflow-y: auto;
        }

        .kb-select-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .kb-select-option {
            padding: 10px 12px;
            color: #2d3748;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }

        .kb-select-option:hover {
            background: #f1f3f4;
        }

        .kb-select-option.selected {
            background: #e8f0fe;
            color: #1a73e8;
        }

        .kb-select-option i {
            margin-right: 8px;
            font-size: 14px;
            color: #667eea;
        }

        .kb-select-option.selected i {
            color: #1a73e8;
        }

        .kb-select-empty {
            padding: 12px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        
        .user-center {
            position: fixed;
            bottom: 24px;
            left: calc(var(--sidebar-width) + 24px);
            z-index: 9999;
        }

        .user-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .user-trigger:hover {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin: 0;
        }

        .user-dropdown {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 0;
            width: 260px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.25s ease;
            border: none;
            overflow: hidden;
        }

        .user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-header {
            padding: 16px;
            border-bottom: 1px solid #e8eaed;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .dropdown-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .dropdown-user-details {
            flex: 1;
        }

        .dropdown-user-name {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .dropdown-login-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin: 2px 0 0;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #5f6368;
            text-decoration: none;
            transition: all 0.2s;
        }

        .dropdown-item:hover {
            background: #f1f3f4;
        }

        .dropdown-item i {
            width: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .dropdown-divider {
            height: 1px;
            background: #e8eaed;
            margin: 0;
        }

        .dropdown-item.logout {
            color: #d93025;
        }

        .dropdown-item.logout i {
            color: #d93025;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
        }
        
        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-header h2 {
            margin: 0;
            color: #1a202c;
            font-size: 1.5rem;
        }
        
        .page-header p {
            margin: 5px 0 0;
            color: #718096;
            font-size: 0.9rem;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead th {
            border-bottom: 2px solid #e2e8f0;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .table tbody tr {
            transition: background-color 0.2s;
        }
        
        .table tbody tr:hover {
            background-color: #f7fafc;
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
        }
        
        .badge-success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
        }
        
        .btn-primary:hover {
            background: #4338ca;
        }
        
        .btn-danger {
            padding: 6px 12px;
            border-radius: 6px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stats-card h3 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stats-card p {
            margin: 5px 0 0;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h4><i class="bi bi-journal-text"></i> RAG知识库</h4>
            <small>管理后台</small>
        </div>
        <div class="px-3 mb-3">
            <label class="text-white small opacity-75">当前知识库</label>
            <div class="kb-select-wrapper">
                <div class="kb-select-trigger" id="kbSelectTrigger" onclick="toggleKbDropdown()">
                    <span id="kbSelectedName">选择知识库</span>
                    <i class="bi bi-chevron-down kb-select-arrow" id="kbSelectArrow"></i>
                </div>
                <div class="kb-select-dropdown" id="kbSelectDropdown">
                    <div class="kb-select-empty" id="kbLoading">加载中...</div>
                </div>
            </div>
            <input type="hidden" id="knowledgeBaseId" name="knowledgeBaseId" value="">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/admin/upload">
                <i class="bi bi-cloud-upload-fill"></i> 文档上传
            </a>
            <a class="nav-link active" href="/admin/documents">
                <i class="bi bi-file-earmark-text-fill"></i> 文档管理
            </a>
            <a class="nav-link" href="/admin/chat">
                <i class="bi bi-chat-dots-fill"></i> 问答测试
            </a>
            <a class="nav-link" href="/admin/channel">
                <i class="bi bi-chat-dots-fill"></i> 消息渠道
            </a>
        </nav>
    </div>

    <!-- 左下角用户中心 -->
    <div class="user-center">
        <div class="user-trigger" onclick="toggleUserDropdown()">
            <div class="user-avatar">
                <i class="bi bi-person"></i>
            </div>
            <div class="user-info">
                <p class="user-name">管理员</p>
            </div>
            <i class="bi bi-chevron-up" style="font-size: 12px; color: #667eea;"></i>
        </div>
        <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-header">
                <div class="dropdown-user-info">
                    <div class="dropdown-avatar">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="dropdown-user-details">
                        <p class="dropdown-user-name">管理员</p>
                        <p class="dropdown-login-time" id="loginTime">登录时间</p>
                    </div>
                </div>
            </div>
            <a href="/admin/knowledge-base" class="dropdown-item">
                <i class="bi bi-folder-fill"></i> 知识库管理
            </a>
            <a href="/admin/config" class="dropdown-item">
                <i class="bi bi-gear-fill"></i> 模型配置
            </a>
            <div class="dropdown-divider"></div>
            <a href="/logout" class="dropdown-item logout">
                <i class="bi bi-box-arrow-right"></i> 退出登录
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="page-header">
            <div>
                <h2><i class="bi bi-file-earmark-text"></i> 文档管理</h2>
                <p>查看和管理已上传的知识库文档</p>
            </div>
            <button class="btn btn-primary" onclick="refreshDocuments()">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
        </div>

        <!-- 统计信息 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stats-card">
                    <h3 id="totalDocs">0</h3>
                    <p><i class="bi bi-file-earmark-check"></i> 已上传文档</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" style="background: #c6f6d5;">
                    <div class="card-body">
                        <h3 class="text-success" id="totalSize">0 MB</h3>
                        <p><i class="bi bi-hdd-stack"></i> 总文件大小</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card" style="background: #fed7d7;">
                    <div class="card-body">
                        <h3 style="color: #c53030;">PDF</h3>
                        <p><i class="bi bi-file-earmark-pdf"></i> 文档类型</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 文档列表 -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-list-ul"></i> 文档列表</h5>
            </div>
            <div class="card-body p-0">
                <div id="documentList"></div>
            </div>
        </div>
        <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">PDF 预览</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" style="height: 80vh;">
                        <iframe id="previewFrame" style="width: 100%; height: 100%; border: none;"></iframe>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">删除确认</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p id="deleteTargetName" class="mb-3 text-danger"></p>
                        <div class="mb-3">
                            <label class="form-label">请输入管理员密码确认删除</label>
                            <input id="deletePassword" type="password" class="form-control" placeholder="请输入密码">
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="deleteConfirmCheck">
                            <label class="form-check-label" for="deleteConfirmCheck">
                                我确认将同时删除 pgsql、minio 与向量库数据
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted" style="font-size: 0.8rem; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);">
        © 2026 xxx公司. All Rights Reserved.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentKnowledgeBaseId = localStorage.getItem('currentKnowledgeBaseId') || 'default';
        let documents = [];
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let pendingDelete = null;

        function loadKnowledgeBases() {
            fetch('/admin/api/knowledge-base/list')
                .then(res => res.json())
                .then(data => {
                    const dropdown = document.getElementById('kbSelectDropdown');
                    const loading = document.getElementById('kbLoading');
                    
                    if (loading) {
                        loading.remove();
                    }
                    
                    dropdown.innerHTML = '';
                    
                    if (data.length === 0) {
                        dropdown.innerHTML = '<div class="kb-select-empty">暂无知识库</div>';
                        return;
                    }
                    
                    data.forEach(kb => {
                        const option = document.createElement('div');
                        option.className = 'kb-select-option';
                        option.dataset.id = kb.id;
                        option.innerHTML = `<i class="bi bi-folder-fill"></i> ${kb.name}`;
                        
                        if (kb.id === currentKnowledgeBaseId) {
                            option.classList.add('selected');
                            document.getElementById('kbSelectedName').textContent = kb.name;
                            document.getElementById('knowledgeBaseId').value = kb.id;
                        }
                        
                        option.addEventListener('click', function() {
                            selectKnowledgeBase(kb.id, kb.name);
                        });
                        
                        dropdown.appendChild(option);
                    });
                    loadDocuments();
                })
                .catch(err => {
                    console.error('加载知识库失败:', err);
                    document.getElementById('kbSelectDropdown').innerHTML = '<div class="kb-select-empty">加载失败</div>';
                });
        }

        function selectKnowledgeBase(id, name) {
            currentKnowledgeBaseId = id;
            localStorage.setItem('currentKnowledgeBaseId', id);
            document.getElementById('kbSelectedName').textContent = name;
            document.getElementById('knowledgeBaseId').value = id;
            
            document.querySelectorAll('.kb-select-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`[data-id="${id}"]`).classList.add('selected');
            
            currentPage = 1;
            loadDocuments();
            closeKbDropdown();
        }

        function toggleKbDropdown() {
            const dropdown = document.getElementById('kbSelectDropdown');
            const arrow = document.getElementById('kbSelectArrow');
            
            if (dropdown.classList.contains('show')) {
                closeKbDropdown();
            } else {
                closeUserDropdown();
                dropdown.classList.add('show');
                arrow.classList.add('open');
            }
        }

        function closeKbDropdown() {
            const dropdown = document.getElementById('kbSelectDropdown');
            const arrow = document.getElementById('kbSelectArrow');
            dropdown.classList.remove('show');
            arrow.classList.remove('open');
        }

        function closeUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) {
                dropdown.classList.remove('show');
            }
        }

        // 加载文档列表
        async function loadDocuments() {
            try {
                const response = await fetch(`/admin/api/documents?page=${currentPage}&size=${pageSize}&knowledgeBaseId=${currentKnowledgeBaseId}`);
                const result = await response.json();
                
                if (result.success) {
                    documents = result.data;
                    totalPages = result.pagination.totalPages || 1;
                    currentPage = result.pagination.page;
                    displayDocuments();
                    updateStats();
                }
            } catch (error) {
                console.error('加载文档列表失败:', error);
            }
        }

        // 显示文档列表
        function displayDocuments() {
            const container = document.getElementById('documentList');
            
            if (documents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h5>暂无文档</h5>
                        <p>请先上传 PDF 文档</p>
                        <a href="/admin/upload" class="btn btn-primary mt-3">
                            <i class="bi bi-cloud-upload"></i> 上传文档
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th><i class="bi bi-file-earmark-pdf"></i> 文件名</th>
                                <th><i class="bi bi-hdd"></i> 大小</th>
                                <th><i class="bi bi-clock"></i> 上传时间</th>
                                <th><i class="bi bi-layers"></i> 分段数</th>
                                <th><i class="bi bi-info-circle"></i> 状态</th>
                                <th><i class="bi bi-gear"></i> 操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${documents.map(doc => `
                                <tr>
                                    <td>
                                        <i class="bi bi-file-earmark-pdf" style="color: #e53e3e;"></i>
                                        <strong>${doc.filename}</strong>
                                    </td>
                                    <td>${doc.size}</td>
                                    <td>${doc.uploadTime}</td>
                                    <td>${doc.segmentCount}</td>
                                    <td><span class="badge badge-success">${doc.status}</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-primary" onclick="previewDocument('${doc.id}')">
                                            <i class="bi bi-eye"></i> 预览
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal('${doc.id}', '${doc.filename}')">
                                            <i class="bi bi-trash"></i> 删除
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center p-3">
                    <div class="text-muted">第 ${currentPage} / ${totalPages} 页</div>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">上一页</button>
                        <button class="btn btn-sm btn-outline-secondary" ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一页</button>
                    </div>
                </div>
            `;
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('totalDocs').textContent = documents.length;
            
            // 计算总大小 (这里简化处理)
            document.getElementById('totalSize').textContent = documents.length + ' 个文件';
        }

        function openDeleteModal(id, filename) {
            pendingDelete = { id, filename };
            document.getElementById('deleteTargetName').textContent = `将删除：${filename}`;
            document.getElementById('deletePassword').value = '';
            document.getElementById('deleteConfirmCheck').checked = false;
            const modal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            modal.show();
        }

        async function confirmDelete() {
            if (!pendingDelete) {
                return;
            }
            const password = document.getElementById('deletePassword').value;
            const confirmed = document.getElementById('deleteConfirmCheck').checked;
            if (!password) {
                showAlert('warning', '请输入删除确认密码');
                return;
            }
            if (!confirmed) {
                showAlert('warning', '请先勾选删除确认');
                return;
            }
            try {
                const response = await fetch(`/admin/api/document/${pendingDelete.id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                    showAlert('success', result.message);
                    loadDocuments();
                } else {
                    showAlert('danger', result.message || '删除失败');
                }
            } catch (error) {
                showAlert('danger', '删除失败: ' + error.message);
            }
        }

        function previewDocument(id) {
            const frame = document.getElementById('previewFrame');
            frame.src = `/admin/api/document/${id}/preview`;
            const modal = new bootstrap.Modal(document.getElementById('previewModal'));
            modal.show();
        }

        function changePage(page) {
            if (page < 1 || page > totalPages) {
                return;
            }
            currentPage = page;
            loadDocuments();
        }

        // 刷新文档列表
        function refreshDocuments() {
            currentPage = 1;
            loadDocuments();
        }

        // 显示提示框
        function showAlert(type, message) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3`;
            alert.style.zIndex = '9999';
            alert.innerHTML = `
                <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            
            setTimeout(() => alert.remove(), 3000);
        }

        // 页面加载时获取文档列表
        document.addEventListener('DOMContentLoaded', loadKnowledgeBases);

        // 用户中心下拉菜单切换
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(e) {
            const userCenter = document.querySelector('.user-center');
            if (!userCenter.contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        // 设置登录时间
        document.addEventListener('DOMContentLoaded', function() {
            const loginTime = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('loginTime').textContent = loginTime;
        });
    </script>
</body>
</html>
