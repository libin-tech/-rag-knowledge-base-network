server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: rag-knowledge-base
  config:
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/rag_knowledge}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

mybatis-plus:
  type-aliases-package: com.bin.ragknowledge.repository
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl



# Milvus 向量数据库配置
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:root}
  password: ${MILVUS_PASSWORD:Milvus}
  collection-name: Enterprise_Knowledge_Base
  dimension: 1024  # 根据 embedding 模型调整

# RAG 配置
rag:
  # 文档分块配置
  chunk:
    max-segment-size: 500
    max-overlap-size: 50
  # 检索配置
  retrieval:
    max-results: 5
    min-score: 0.7



# 日志配置
logging:
  level:
    com.bin.ragknowledge: INFO
    dev.langchain4j: DEBUG
    com.bin.ragknowledge.lark: DEBUG

# 登录配置
auth:
  # 默认管理员用户名
  admin-username: ${ADMIN_USERNAME:admin}
  # 默认管理员密码
  admin-password: ${ADMIN_PASSWORD:admin@2026}

# 文件存储配置
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:rag-documents}
