server:
  port: 8080

spring:
  application:
    name: rag-knowledge-base
  config:
    # 本地启动时可在项目根目录创建 application-local.yml 覆盖默认配置
    # 文件不存在也不会报错
    import: optional:file:./application-local.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# LLM 配置 - 支持云端和本地切换
llm:
  # 模式选择: dashscope 或 ollama
  mode: ollama

  # 阿里云 DashScope 配置
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-plus

  # Ollama 本地配置
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model-name: qwen3
    timeout: 60s

# Embedding 模型配置
embedding:
  # Embedding 模式: dashscope 或 ollama
  mode: ${LLM_MODE:ollama}

  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: text-embedding-v3

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model-name: qwen3-embedding
    timeout: 60s

# Milvus 向量数据库配置
milvus:
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:root}
  password: ${MILVUS_PASSWORD:Milvus}
  collection-name: Enterprise_Knowledge_Base
  dimension: 4096  # 根据 embedding 模型调整

# RAG 配置
rag:
  # 文档分块配置
  chunk:
    max-segment-size: 500
    max-overlap-size: 50
  # 检索配置
  retrieval:
    max-results: 5
    min-score: 0.7


feishu:
  app:
    app-id: ${FEI_SHU_APP_ID:}
    app-secret: ${FEI_SHU_APP_SECRET:}

# 钉钉应用配置
# 用于集成钉钉开放平台API，提供应用身份认证和授权功能
dingtalk:
  app:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}



# 日志配置
logging:
  level:
    com.bin.ragknowledge: INFO
    dev.langchain4j: DEBUG
    com.bin.ragknowledge.lark: DEBUG

# 登录配置
auth:
  # 默认管理员用户名
  admin-username: ${ADMIN_USERNAME:admin}
  # 默认管理员密码
  admin-password: ${ADMIN_PASSWORD:admin@2026}
